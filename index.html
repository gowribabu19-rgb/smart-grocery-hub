<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Grocery Scanner</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 16px; text-align: center; }
    .container { max-width: 480px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; font-size: 22px; color: #1c1e21; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    .result-card { display: none; padding: 16px; border-radius: 12px; margin-top: 16px; text-align: left; }
    .safe { border-left: 6px solid #2ecc71; background: #f0fdf4; }
    .banned { border-left: 6px solid #e74c3c; background: #fef2f2; }
    .not-found { border-left: 6px solid #f59e0b; background: #fffbeb; }
    .compare-card { border-left: 6px solid #3b82f6; background: #eff6ff; }
    .banned-tag { background: #fee2e2; color: #dc2626; padding: 3px 8px; border-radius: 6px; font-weight: 600; font-size: 12px; display: inline-block; margin: 2px; }
    button { background: #007aff; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
    button.compare-btn { background: #10b981; margin-top: 6px; }
    input { width: 100%; padding: 10px; margin: 6px 0 12px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
    label { font-size: 13px; font-weight: 600; color: #374151; display: block; text-align: left; }
    .divider { margin: 20px 0; border: none; border-top: 1px solid #e5e7eb; position: relative; }
    .divider span { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: white; padding: 0 10px; color: #9ca3af; font-size: 12px; font-weight: 600; }
    .store-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #e5e7eb; }
    .store-price { font-weight: 700; color: #111827; }
    .cheapest { color: #059669; font-weight: 800; }
  </style>
</head>
<body>

<div class="container">
  <h1>🛒 Smart Grocery Scanner</h1>
  <p style="color:#6b7280; font-size:14px; margin-top:-4px;">Scan barcode or compare web prices</p>

  <!-- BARCODE SCANNER -->
  <div id="reader"></div>
  <button id="start-btn" onclick="startScanner()">📷 Start Camera Scanner</button>

  <div class="divider"><span>OR</span></div>

  <!-- WEB PRICE SEARCH -->
  <label>🔍 Compare Prices Across Platforms:</label>
  <input type="text" id="web-search-query" placeholder="Paste product link or name...">
  <button class="compare-btn" onclick="compareWebPrices()">⚡ Compare Across Stores</button>

  <!-- SAFETY RESULT CARD -->
  <div id="result" class="result-card"></div>

  <!-- PRICE COMPARISON CARD (separate, so safety result stays visible) -->
  <div id="compare-result" class="result-card"></div>
</div>

<script>
  const N8N_GATEWAY_URL = 'https://s30.n8n.alexaiautomations.com/webhook/sg02-gateway';

  const html5QrCode = new Html5Qrcode("reader");
  const resultCard = document.getElementById('result');
  const compareCard = document.getElementById('compare-result');
  let lastScannedBarcode = '';

  // Prevent broken HTML when product names contain quotes or symbols
  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // MOBILE SHARE-TARGET LISTENER
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const sharedText = params.get('text') || params.get('title') || params.get('url');

    if (sharedText) {
      let cleaned = sharedText.replace(/https?:\/\/\S+/g, '').replace(/[^a-zA-Z0-9\s]/g, ' ').trim();
      if (!cleaned && params.get('title')) {
        cleaned = params.get('title').replace(/[^a-zA-Z0-9\s]/g, ' ').trim();
      }
      const words = cleaned.split(/\s+/).slice(0, 5).join(' ');
      if (words) {
        document.getElementById('web-search-query').value = words;
        compareWebPrices();
      }
    }
  });

  // ================= BARCODE SCANNER =================
  function startScanner() {
    document.getElementById('start-btn').style.display = 'none';
    resultCard.style.display = 'none';
    compareCard.style.display = 'none';
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
      html5QrCode.stop();
      document.getElementById('start-btn').style.display = 'block';
      document.getElementById('start-btn').innerText = '🔄 Scan Another Product';
      lastScannedBarcode = decodedText;
      analyzeBarcode(decodedText);
    }).catch(err => {
      alert('Camera error: ' + err);
      document.getElementById('start-btn').style.display = 'block';
    });
  }

  async function analyzeBarcode(barcode) {
    resultCard.style.display = 'block';
    resultCard.className = 'result-card not-found';
    resultCard.innerHTML = `<p>⏳ Checking global database for <strong>${escapeHtml(barcode)}</strong>...</p>`;

    try {
      const response = await fetch(N8N_GATEWAY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'barcode', barcode: barcode })
      });
      const data = await response.json();
      renderResult(data, barcode);
    } catch (err) {
      resultCard.className = 'result-card banned';
      resultCard.innerHTML = `<p>❌ Could not connect to n8n. Verify SG-02 is Active.</p>`;
    }
  }

  // ================= SAFETY RESULT =================
  function renderResult(data, barcode) {
    if (!data.found) {
      resultCard.className = "result-card not-found";
      resultCard.innerHTML = `
        <h3 style="margin-top:0; color:#b45309;">📦 Product Not In Database</h3>
        <p style="font-size:13px; color:#6b7280;">Barcode: <code>${escapeHtml(barcode)}</code></p>
        <hr style="border:none; border-top:1px solid #fde68a; margin:12px 0;">
        <p style="font-size:13px; font-weight:600;">✨ Quick-Add to your Google Sheet:</p>
        <label>Product Name:
          <input type="text" id="quick-name" placeholder="e.g., Sensodyne Paste 100g">
        </label>
        <label>Price (₹):
          <input type="number" step="0.01" id="quick-price" placeholder="e.g., 140">
        </label>
        <label>Store Name:
          <input type="text" id="quick-store" placeholder="e.g., Apollo Pharmacy">
        </label>
        <button onclick="saveNewProduct('${escapeHtml(barcode)}')">💾 Save to Smart Grocery Sheet</button>
      `;
      return;
    }

    // Auto-fill search box with Brand + Product Name for 1-click compare
    const brandPart = (data.brand && data.brand !== 'Standard Brand' && data.brand !== 'Catalog Product') ? data.brand + ' ' : '';
    document.getElementById('web-search-query').value = (brandPart + (data.product_name || '')).trim();

    const bannedList = Array.isArray(data.banned_found) ? data.banned_found : [];

    resultCard.className = "result-card " + (data.is_safe ? "safe" : "banned");
    resultCard.innerHTML = `
      <h2 style="margin-top:0; font-size:18px;">${escapeHtml(data.product_name)}</h2>
      <p style="font-size:13px; margin:4px 0;"><strong>Brand:</strong> ${escapeHtml(data.brand || 'N/A')} | <strong>Size:</strong> ${escapeHtml(data.net_weight || 'Standard Pack')}</p>
      <p style="font-size:14px; font-weight:700; margin:8px 0; color:${data.is_safe ? '#16a34a' : '#dc2626'};">
        ${data.is_safe ? "✅ SAFE TO BUY - No banned chemicals" : "⚠️ WARNING: Banned Ingredients Detected"}
      </p>
      ${!data.is_safe ? `<div style="margin:6px 0;">${bannedList.map(b => `<span class="banned-tag">${escapeHtml(b)}</span>`).join(' ')}</div>` : ''}
      <details style="margin-top:10px; font-size:12px; color:#4b5563;">
        <summary style="cursor:pointer; font-weight:600;">View Ingredients</summary>
        <p style="margin-top:6px; line-height:1.4;">${escapeHtml(data.ingredients_text || 'No ingredients listed')}</p>
      </details>

      <!-- 1-CLICK PRICE COMPARISON -->
      <hr style="border:none; border-top:1px solid #e5e7eb; margin:14px 0;">
      <button class="compare-btn" onclick="compareWebPrices()">⚡ Compare Prices for This Product</button>
    `;
  }

  // ================= WEB PRICE COMPARISON =================
  async function compareWebPrices() {
    const query = document.getElementById('web-search-query').value.trim();
    if (!query) {
      alert('Please enter a product name or link!');
      return;
    }

    compareCard.style.display = 'block';
    compareCard.className = 'result-card compare-card';
    compareCard.innerHTML = `<p>⏳ Searching live prices across Amazon, Blinkit, Zepto, and BigBasket for <strong>${escapeHtml(query)}</strong>...</p>`;
    compareCard.scrollIntoView({ behavior: 'smooth', block: 'start' });

    try {
      const response = await fetch(N8N_GATEWAY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'compare_web', query: query })
      });
      const data = await response.json();
      renderComparisonResult(data, query);
    } catch (err) {
      compareCard.className = 'result-card banned';
      compareCard.innerHTML = `<p>❌ Price comparison failed to connect. Check n8n status.</p>`;
    }
  }

  function renderComparisonResult(data, query) {
    if (!data.results || data.results.length === 0) {
      compareCard.className = 'result-card not-found';
      compareCard.innerHTML = `
        <h3 style="margin-top:0;">🔍 No Price Matches Found</h3>
        <p style="font-size:13px;">Could not find online prices for <strong>${escapeHtml(query)}</strong>. Try fewer keywords (e.g., "Simple Face Wash").</p>
      `;
      return;
    }

    const results = [...data.results].sort((a, b) => a.price - b.price);
    const cheapest = results[0];
    const highest = results[results.length - 1];
    const savings = (highest.price - cheapest.price).toFixed(2);

    let rowsHtml = '';
    results.forEach((item, index) => {
      const isBest = index === 0;
      rowsHtml += `
        <div class="store-row">
          <div><strong>${escapeHtml(item.store)}</strong> ${isBest ? '🏆' : ''}</div>
          <div class="store-price ${isBest ? 'cheapest' : ''}">₹${item.price}</div>
        </div>
      `;
    });

    compareCard.className = 'result-card compare-card';
    compareCard.innerHTML = `
      <h3 style="margin-top:0; color:#059669;">💰 Best Price: ₹${cheapest.price} on ${escapeHtml(cheapest.store)}</h3>
      <p style="font-size:13px; color:#374151; margin-bottom:12px;">Found across ${results.length} platform(s) for <strong>${escapeHtml(query)}</strong>:</p>
      ${rowsHtml}
      <p style="font-size:13px; font-weight:700; margin-top:12px; color:#065f46;">
        🎯 Recommendation: Buy from ${escapeHtml(cheapest.store)}${parseFloat(savings) > 0 ? ` (save ₹${savings} vs ${escapeHtml(highest.store)})` : ''}
      </p>
    `;
  }

  // ================= QUICK-ADD TO SHEET =================
  async function saveNewProduct(barcode) {
    const name = document.getElementById('quick-name').value.trim();
    const price = document.getElementById('quick-price').value.trim();
    const store = document.getElementById('quick-store').value.trim();

    if (!name || !price) {
      alert('Please enter at least Product Name and Price!');
      return;
    }

    resultCard.innerHTML = "<p>⏳ Saving to Google Sheets...</p>";

    try {
      const res = await fetch(N8N_GATEWAY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mode: 'crowd_submit',
          barcode: barcode,
          canonical_name: name,
          price: parseFloat(price),
          store_name: store || 'Local Shop',
          submitted_by: 'Mobile User'
        })
      });
      await res.json();
      resultCard.className = "result-card safe";
      resultCard.innerHTML = `<h3>✅ Saved Successfully!</h3><p>Added <strong>${escapeHtml(name)}</strong> (₹${escapeHtml(price)}) to your Store_Prices database.</p>`;
    } catch (e) {
      alert('Error saving product: ' + e);
    }
  }
</script>
<a href="list.html" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:14px 22px;border-radius:30px;text-decoration:none;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:999">📝 Scan Monthly List</a>
<script>
(function () {
  var KEY = 'sg_pincode';
  var STORES = ['Blinkit', 'Zepto', 'Swiggy Instamart', 'Amazon Fresh', 'BigBasket'];
  var saved = '';
  try { saved = localStorage.getItem(KEY) || ''; } catch (e) {}

  // Pincode box
  var bar = document.createElement('div');
  bar.style.cssText = 'max-width:520px;margin:12px auto 0;padding:10px 14px;background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;gap:8px;font-family:Roboto,Arial,sans-serif;font-size:15px';
  var label = document.createElement('span');
  label.textContent = '📍 Your pincode:';
  var input = document.createElement('input');
  input.type = 'text';
  input.inputMode = 'numeric';
  input.maxLength = 6;
  input.placeholder = '600017';
  input.value = saved;
  input.style.cssText = 'flex:1;padding:8px;border:1px solid #d1d5db;border-radius:8px;font-size:16px';
  input.addEventListener('input', function () {
    input.value = input.value.replace(/\D/g, '').slice(0, 6);
    try { localStorage.setItem(KEY, input.value); } catch (e) {}
  });
  bar.appendChild(label);
  bar.appendChild(input);
  document.body.insertBefore(bar, document.body.firstChild);

  // Store suggestions for the quick-add form
  var dl = document.createElement('datalist');
  dl.id = 'sg-stores';
  STORES.forEach(function (s) {
    var o = document.createElement('option');
    o.value = s;
    dl.appendChild(o);
  });
  document.body.appendChild(dl);
  new MutationObserver(function () {
    var el = document.getElementById('quick-store');
    if (el && !el.getAttribute('list')) {
      el.setAttribute('list', 'sg-stores');
      el.placeholder = 'Blinkit, Zepto, Swiggy Instamart...';
    }
  }).observe(document.body, { childList: true, subtree: true });

  // Send the pincode, and show an error when the server fails
  var origFetch = window.fetch;
  window.fetch = function (url, opts) {
    try {
      if (opts && typeof opts.body === 'string' && opts.body.charAt(0) === '{' && /^\d{6}$/.test(input.value)) {
        var o = JSON.parse(opts.body);
        o.pincode = input.value;
        opts.body = JSON.stringify(o);
      }
    } catch (e) {}
    var isGateway = String(url).indexOf('/webhook/') !== -1;
    return origFetch.apply(this, arguments).then(function (r) {
      if (isGateway && !r.ok) {
        throw new Error('The server could not save this. Please check the store name (Blinkit, Zepto, Swiggy Instamart, Amazon Fresh or BigBasket) and the price.');
      }
      return r;
    });
  };
})();
</script>
</body>
</html>
