<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Grocery Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        .result-card { display: none; padding: 20px; border-radius: 10px; margin-top: 20px; text-align: left; border-left: 8px solid #ccc; font-size: 14px; }
        .safe { border-color: #2ecc71; background: #eafaf1; }
        .banned { border-color: #e74c3c; background: #fdedec; }
        .banned-list { color: #e74c3c; font-weight: bold; }
        button { background: #007aff; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛒 Grocery Scanner</h1>
    <p>Scan a barcode to check ingredients and safety.</p>
    
    <div id="reader"></div>
    <button id="start-btn" onclick="startScanner()">Start Camera</button>

    <div id="result" class="result-card"></div>
</div>

<script>
    const html5QrCode = new Html5Qrcode("reader");
    const resultCard = document.getElementById('result');

    function startScanner() {
        document.getElementById('start-btn').style.display = 'none';
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
        
        html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
            html5QrCode.stop();
            analyzeBarcode(decodedText);
        });
    }

    async function analyzeBarcode(barcode) {
        resultCard.style.display = 'block';
        resultCard.innerHTML = "⏳ Analyzing barcode " + barcode + "...";

        try {
            // REPLACE THE URL BELOW WITH YOUR n8n PRODUCTION WEBHOOK URL
            const response = await fetch('https://s30.n8n.alexaiautomations.com/webhook/sg02-gateway', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mode: 'barcode', barcode: barcode })
            });

            const data = await response.json();
            renderResult(data);
        } catch (err) {
            resultCard.innerHTML = "❌ Connection Error. Make sure SG-02 is ACTIVE in n8n.";
        }
    }

    function renderResult(data) {
        if (!data.found) {
            resultCard.className = "result-card banned";
            resultCard.innerHTML = "❓ Product not found in global database.";
            return;
        }

        resultCard.className = "result-card " + (data.is_safe ? "safe" : "banned");
        resultCard.innerHTML = `
            <h2 style="margin-top:0">${data.product_name}</h2>
            <p><strong>Brand:</strong> ${data.brand}</p>
            <p><strong>Status:</strong> ${data.is_safe ? "✅ SAFE TO BUY" : "⚠️ AVOID: Banned Ingredients Found"}</p>
            ${!data.is_safe ? `<p class="banned-list">${data.banned_found.join(', ')}</p>` : ''}
            <p><strong>Ingredients:</strong> ${data.ingredients_text.substring(0, 150)}...</p>
        `;
    }
</script>

</body>
</html>
