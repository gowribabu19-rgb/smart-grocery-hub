<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Grocery Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- Client-Side Zero-AI OCR Engine -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 16px; text-align: center; }
    .container { max-width: 480px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; font-size: 22px; color: #1c1e21; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    .result-card { display: none; padding: 16px; border-radius: 12px; margin-top: 16px; text-align: left; }
    .safe { border-left: 6px solid #2ecc71; background: #f0fdf4; }
    .banned { border-left: 6px solid #e74c3c; background: #fef2f2; }
    .not-found { border-left: 6px solid #f59e0b; background: #fffbeb; }
    .banned-tag { background: #fee2e2; color: #dc2626; padding: 3px 8px; border-radius: 6px; font-weight: 600; font-size: 12px; display: inline-block; margin: 2px; }
    button { background: #007aff; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
    button.secondary { background: #6b7280; margin-top: 8px; }
    .ocr-btn { background: #059669; margin: 8px 0 12px 0; }
    input { width: 100%; padding: 10px; margin: 6px 0 12px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
    label { font-size: 13px; font-weight: 600; color: #374151; display: block; text-align: left; }
  </style>
</head>
<body>

<div class="container">
  <h1>🛒 Smart Grocery Scanner</h1>
  <p style="color:#6b7280; font-size:14px; margin-top:-4px;">Scan barcode or price tag</p>

  <div id="reader"></div>
  <button id="start-btn" onclick="startScanner()">📷 Start Camera</button>

  <div id="result" class="result-card"></div>
</div>

<script>
  // YOUR N8N PRODUCTION WEBHOOK URL
  const N8N_GATEWAY_URL = 'https://s30.n8n.alexaiautomations.com/webhook/sg02-gateway';

  const html5QrCode = new Html5Qrcode("reader");
  const resultCard = document.getElementById('result');
  let lastScannedBarcode = '';

  function startScanner() {
    document.getElementById('start-btn').style.display = 'none';
    resultCard.style.display = 'none';
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
      html5QrCode.stop();
      document.getElementById('start-btn').style.display = 'block';
      document.getElementById('start-btn').innerText = '🔄 Scan Another Product';
      lastScannedBarcode = decodedText;
      analyzeBarcode(decodedText);
    }).catch(err => {
      alert('Camera error: ' + err);
      document.getElementById('start-btn').style.display = 'block';
    });
  }

  async function analyzeBarcode(barcode) {
    resultCard.style.display = 'block';
    resultCard.className = 'result-card not-found';
    resultCard.innerHTML = `<p>⏳ Checking global database for <strong>${barcode}</strong>...</p>`;

    try {
      const response = await fetch(N8N_GATEWAY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'barcode', barcode: barcode })
      });

      const data = await response.json();
      renderResult(data, barcode);
    } catch (err) {
      resultCard.className = 'result-card banned';
      resultCard.innerHTML = `<p>❌ Could not connect to n8n. Verify SG-02 is Active.</p>`;
    }
  }

  function renderResult(data, barcode) {
    if (!data.found) {
      resultCard.className = "result-card not-found";
      resultCard.innerHTML = `
        <h3 style="margin-top:0; color:#b45309;">📦 Product Not In Database</h3>
        <p style="font-size:13px; color:#6b7280;">Barcode: <code>${barcode}</code></p>
        <hr style="border:none; border-top:1px solid #fde68a; margin:12px 0;">

        <!-- ZERO-AI CLIENT OCR CAPTURE -->
        <label style="color:#059669; font-weight:700;">📸 Auto-Fill via MRP / Label Photo:</label>
        <label class="ocr-btn" style="display:block; text-align:center; padding:10px 0; border-radius:8px; color:white; cursor:pointer;">
          📷 Snap Label / MRP Tag
          <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="processLabelOCR(this)">
        </label>
        <div id="ocr-status" style="font-size:12px; margin-bottom:10px; font-weight:600;"></div>

        <p style="font-size:13px; font-weight:600;">✨ Quick-Add to your Google Sheet:</p>
        <label>Product Name:
          <input type="text" id="quick-name" placeholder="e.g., Sensodyne Paste 100g">
        </label>
        <label>Price (₹):
          <input type="number" id="quick-price" placeholder="e.g., 140">
        </label>
        <label>Store Name:
          <input type="text" id="quick-store" placeholder="e.g., Apollo Pharmacy">
        </label>
        <button onclick="saveNewProduct('${barcode}')">💾 Save to Smart Grocery Sheet</button>
      `;
      return;
    }

    resultCard.className = "result-card " + (data.is_safe ? "safe" : "banned");
    resultCard.innerHTML = `
      <h2 style="margin-top:0; font-size:18px;">${data.product_name}</h2>
      <p style="font-size:13px; margin:4px 0;"><strong>Brand:</strong> ${data.brand || 'N/A'} | <strong>Size:</strong> ${data.net_weight || 'N/A'}</p>
      <p style="font-size:14px; font-weight:700; margin:8px 0; color:${data.is_safe ? '#16a34a' : '#dc2626'};">
        ${data.is_safe ? "✅ SAFE TO BUY - No banned chemicals" : "⚠️ WARNING: Banned Ingredients Detected"}
      </p>
      ${!data.is_safe ? `<div style="margin:6px 0;">${data.banned_found.map(b => `<span class="banned-tag">${b}</span>`).join(' ')}</div>` : ''}
      <details style="margin-top:10px; font-size:12px; color:#4b5563;">
        <summary style="cursor:pointer; font-weight:600;">View Ingredients</summary>
        <p style="margin-top:6px; line-height:1.4;">${data.ingredients_text || 'No ingredients listed'}</p>
      </details>
    `;
  }

  // CLIENT-SIDE DETERMINISTIC OCR ENGINE (ZERO-AI)
  async function processLabelOCR(inputElement) {
    const file = inputElement.files[0];
    if (!file) return;

    const status = document.getElementById('ocr-status');
    status.style.color = '#007aff';
    status.innerText = '⏳ Reading image with local OCR...';

    try {
      const worker = await Tesseract.createWorker('eng');
      const ret = await worker.recognize(file);
      await worker.terminate();

      const text = ret.data.text;
      status.innerText = '⚡ Extracting Price and Name...';

      // 1. Deterministic MRP Matcher (matches MRP, M.R.P., RS, ₹, INR)
      const mrpRegex = /(?:M\.?R\.?P\.?|RS\.?|₹|\bINR)\s*[:.-]?\s*(\d+(?:\.\d{1,2})?)/i;
      const priceMatch = text.match(mrpRegex);
      if (priceMatch && priceMatch[1]) {
        document.getElementById('quick-price').value = parseFloat(priceMatch[1]);
      }

      // 2. Deterministic Clean Product Name Matcher
      const noiseWords = ['NET QTY', 'BATCH', 'MFG', 'EXP', 'USE BY', 'BEST BEFORE', 'PKD', 'MRP', 'INCL', 'TAXES', 'GRAMS', 'MARKETED', 'CUSTOMER'];
      const cleanLine = text.split('\n')
        .map(l => l.trim())
        .filter(l => l.length > 3 && /[a-zA-Z]{3,}/.test(l))
        .find(l => !noiseWords.some(w => l.toUpperCase().includes(w)));

      if (cleanLine) {
        document.getElementById('quick-name').value = cleanLine.replace(/^[^a-zA-Z0-9]+|[^a-zA-Z0-9]+$/g, '').trim();
      }

      status.style.color = '#16a34a';
      status.innerText = '✅ Extracted! Verify values above.';
    } catch (err) {
      status.style.color = '#dc2626';
      status.innerText = '❌ OCR failed. Please type manually.';
    }
  }

  async function saveNewProduct(barcode) {
    const name = document.getElementById('quick-name').value.trim();
    const price = document.getElementById('quick-price').value.trim();
    const store = document.getElementById('quick-store').value.trim();

    if (!name || !price) {
      alert('Please enter at least Product Name and Price!');
      return;
    }

    resultCard.innerHTML = "<p>⏳ Saving to Google Sheets...</p>";

    try {
      const res = await fetch(N8N_GATEWAY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mode: 'crowd_submit',
          barcode: barcode,
          canonical_name: name,
          price: parseFloat(price),
          store_name: store || 'Local Shop',
          submitted_by: 'Mobile User'
        })
      });

      const out = await res.json();
      resultCard.className = "result-card safe";
      resultCard.innerHTML = `<h3>✅ Saved Successfully!</h3><p>Added <strong>${name}</strong> (₹${price}) to your Store_Prices database.</p>`;
    } catch (e) {
      alert('Error saving product: ' + e);
    }
  }
</script>
</body>
</html>
